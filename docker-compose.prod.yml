services:
  # 1. REDIS: Dùng chung cho BullMQ (Server & Scheduler)
  redis:
    image: redis:7-alpine
    container_name: tobomeet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy allkeys-lru
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - tobomeet-network

  # 2. TOBOMEET CORE API SERVER (NestJS)
  server:
    image: ${DOCKER_USERNAME:-tobomeet}/tobomeet-server:latest
    container_name: tobomeet-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WHITEBOARD_SERVER_URL=http://whiteboard:3002
      - SCHEDULER_SERVICE_URL=http://scheduler:2909
      - NODE_OPTIONS=--max-old-space-size=256 --expose-gc
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/apps/server/uploads
    restart: unless-stopped
    mem_limit: 320m
    mem_reservation: 180m
    cpus: 0.50
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
        reservations:
          memory: 180M
    networks:
      - tobomeet-network

  # 3. WHITEBOARD SYNC SERVER (tldraw SQLite sync server)
  whiteboard:
    image: ${DOCKER_USERNAME:-tobomeet}/tobomeet-whiteboard:latest
    container_name: tobomeet-whiteboard
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NODE_OPTIONS=--max-old-space-size=128 --expose-gc
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/whiteboard:/app/data/rooms
    restart: unless-stopped
    mem_limit: 160m
    mem_reservation: 80m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M
        reservations:
          memory: 80M
    networks:
      - tobomeet-network

  # 4. SCHEDULER SERVICE (NestJS cron / BullMQ scheduler)
  scheduler:
    image: ${DOCKER_USERNAME:-tobomeet}/tobomeet-scheduler:latest
    container_name: tobomeet-scheduler
    ports:
      - "2909:2909"
    environment:
      - NODE_ENV=production
      - PORT=2909
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_OPTIONS=--max-old-space-size=128 --expose-gc
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 160m
    mem_reservation: 80m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M
        reservations:
          memory: 80M
    networks:
      - tobomeet-network

  # 5. LIVEKIT AGENT (Python STT transcription worker kết nối Cloud LiveKit)
  livekit-agent:
    image: ${DOCKER_USERNAME:-tobomeet}/tobomeet-livekit-agent:latest
    container_name: tobomeet-livekit-agent
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONOPTIMIZE=1
      - MALLOC_TRIM_THRESHOLD_=100000
    env_file:
      - path: .env
        required: false
    volumes:
      - ./transcripts:/app/transcripts
    restart: unless-stopped
    shm_size: 128m
    mem_limit: 320m
    mem_reservation: 100m
    cpus: 0.40
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 320M
        reservations:
          memory: 100M
    networks:
      - tobomeet-network

  # 6. CADDY REVERSE PROXY & AUTOMATIC HTTPS (Let's Encrypt / ZeroSSL)
  caddy:
    image: caddy:2-alpine
    container_name: tobomeet-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Hỗ trợ HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - whiteboard
    mem_limit: 64m
    mem_reservation: 30m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 64M
        reservations:
          memory: 30M
    networks:
      - tobomeet-network

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  tobomeet-network:
    driver: bridge
